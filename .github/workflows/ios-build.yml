name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project YoneticiAsistani.xcodeproj \
            -scheme YoneticiAsistani \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: always()
        run: |
          echo "## Derleme Hataları" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|warning:" build.log | tail -n 100 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "iOS derlemesi başarısız oldu."
          exit 1
