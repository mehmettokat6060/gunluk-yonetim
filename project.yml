name: YoneticiAsistani

options:
  bundleIdPrefix: com.mehmettokat
  deploymentTarget:
    iOS: "17.0"

targets:
  YoneticiAsistani:
    type: application
    platform: iOS
    sources:
      - AppStore.swift
      - ContentView.swift
      - DashboardView.swift
      - AddProgramView.swift
      - CalendarView.swift
      - TasksView.swift
      - InstructionsView.swift
      - MoreView.swift
      - AIAssistantView.swift
      - YoneticiAsistaniApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mehmettokat.yoneticiasistani
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
