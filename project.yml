name: YoneticiAsistani

options:
  bundleIdPrefix: com.yonetici
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  YoneticiAsistani:
    type: application
    platform: iOS
    sources:
      - YoneticiAsistaniApp.swift
      - AppStore.swift
      - ContentView.swift
      - DashboardView.swift
      - AddProgramView.swift
      - CalendarView.swift
      - TasksView.swift
      - InstructionsView.swift
      - AIAssistantView.swift
      - MoreView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yonetici.YoneticiAsistani
        INFOPLIST_KEY_CFBundleDisplayName: "Yönetici Asistanı"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.business"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
      testTargets: []
